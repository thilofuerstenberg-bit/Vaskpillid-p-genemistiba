<!doctype html><html lang="et"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vaskpillide põgenemistuba</title><style>body{font:18px system-ui;background:#10182d;color:#f7f4e8;margin:0;padding:20px}main{max-width:750px;margin:auto}section{background:#1d2b49;padding:24px;border:1px solid #536987;border-radius:18px;margin:18px 0}h1{color:#ffd66b}button,input,select{font:inherit;padding:13px;border-radius:10px;margin:6px;border:0}button{background:#ffd66b;color:#162039;cursor:pointer}button:disabled{opacity:.45}input{max-width:90%;background:#fff} .opt{display:block;width:100%;text-align:left;background:#dce7f8}.ok{color:#82f1ab}.bad{color:#ffb6a6}.muted{color:#bdc9df}#game{display:none}</style><main><h1>🎺 Vaskpillide põgenemistuba</h1><p>Üksi lahendad. Koos pääsete välja!</p><section id="setup"><label>Võistkonna nimi <input id="team" placeholder="Näiteks Tuubad"></label><p>Mitu mängijat?</p><select id="count"><option>2</option><option>3</option><option selected>4</option></select><p>Ühel seadmel mängides vahetage kordamööda mängijat. Ärge vaadake teiste vastuseid!</p><button onclick="start()">Alusta missiooni →</button></section><div id="game"><section><div id="status"></div><h2 id="heading"></h2><p id="question"></p><div id="answers"></div><p id="feedback" aria-live="polite"></p><button id="next" style="display:none" onclick="advance()">Edasi →</button></section></div></main><script>
const sets=[
[{q:"Kuidas tekib vaskpuhkpillis heli?",a:["Huulte võnkumisel huulikus","Pillikeele võnkumisel","Õhu puhumisel üle ava"],c:0},{q:"Mis on huulik?",a:["Pilli kandekott","Osa, mille vastu huuled võnguvad","Pilli puhastusvahend"],c:1},{q:"Milline pill on tavaliselt kõige kõrgema kõlaga?",a:["Tuuba","Trompet","Tromboon"],c:1}],
[{q:"Kuidas tromboon muudab toru pikkust?",a:["Liuguriga","Klahvidega","Keeltega"],c:0},{q:"Milleks on vaskpillil ventiilid?",a:["Värvi muutmiseks","Toru pikkuse muutmiseks","Heli salvestamiseks"],c:1},{q:"Milline pill mängib tavaliselt kõige madalamalt?",a:["Trompet","Metsasarv","Tuuba"],c:2}],
[{q:"Milline on metsasarve kuju?",a:["Sirge puidust toru","Ümaralt keerdunud toru","Väike nelinurkne kast"],c:1},{q:"Mis on sordiin?",a:["Kõlavärvi muutev vahend","Uus pilliliik","Pilli hoidik"],c:0},{q:"Kus kasutatakse vaskpuhkpille?",a:["Ainult klassikalises muusikas","Ainult marsimuusikas","Orkestrites, džässis ja mujal"],c:2}],
[{q:"Mille poolest erineb trompet tuubast?",a:["Trompet on tavaliselt kõrgema kõlaga","Tuuba on kõrgema kõlaga","Neil on alati sama kõla"],c:0},{q:"Kuidas saab mängija muuta helikõrgust?",a:["Ainult valjemini puhudes","Huulte pinget ja toru pikkust muutes","Pilli värvides"],c:1},{q:"Miks sobivad vaskpillid pidulikku muusikasse?",a:["Neil pole tugevust","Nende kõla võib olla särav ja võimas","Need on alati vaiksed"],c:1}]
];
const finals=[{q:"Pange pillid tavalisest kõrgeimast madalaimani.",a:["Tuuba, tromboon, trompet","Trompet, tromboon, tuuba","Tromboon, tuuba, trompet"],c:1},{q:"Mis ühendab kõiki vaskpuhkpille?",a:["Heli tekitavad võnkuvad huuled","Kõigil on liugur","Kõik on valmistatud ainult vasest"],c:0},{q:"Milline väide on õige?",a:["Sordiin muudab kõlavärvi, ventiil muudab toru pikkust","Sordiin muudab toru pikkust","Huulik on sama mis liugur"],c:0}];
let n=4,p=0,i=0,stage="solo",codes=[],answered=false,tries=0;
function start(){n=+document.getElementById("count").value;p=0;i=0;stage="solo";codes=[];document.getElementById("setup").style.display="none";document.getElementById("game").style.display="block";render()}
function render(){answered=false;document.getElementById("next").style.display="none";document.getElementById("feedback").textContent="";let item=stage==="solo"?sets[p%4][i]:finals[i];document.getElementById("status").textContent=stage==="solo"?"🔐 Üksikmissioon • mängija "+(p+1)+"/"+n+" • küsimus "+(i+1)+"/3":"🤝 Ühismissioon • küsimus "+(i+1)+"/3";document.getElementById("heading").textContent=stage==="solo"?"Mängija "+(p+1)+": ava oma lukk":"Ühendage teadmised!";document.getElementById("question").textContent=item.q;document.getElementById("answers").innerHTML="";item.a.forEach((a,j)=>{let b=document.createElement("button");b.className="opt";b.textContent=String.fromCharCode(65+j)+". "+a;b.onclick=()=>choose(j,item.c);document.getElementById("answers").append(b)})}
function choose(j,c){if(answered)return;tries++;let f=document.getElementById("feedback");if(j!==c){f.className="bad";f.textContent="Lukk jäi kinni! Proovi uuesti. Mõtle, miks teine vastus võiks sobida.";return}answered=true;f.className="ok";f.textContent="✓ Õige! Lukk avanes.";document.querySelectorAll(".opt").forEach(b=>b.disabled=true);document.getElementById("next").style.display="inline-block"}
function advance(){i++;if(i<3){render();return}i=0;if(stage==="solo"){codes.push([4,7,2,9][p%4]);p++;if(p<n){document.getElementById("heading").textContent="Mängija vahetus";document.getElementById("question").textContent="Mängija "+p+" sai oma salajase numbri: "+codes[p-1]+". Anna seade järgmisele mängijale.";document.getElementById("answers").innerHTML="";document.getElementById("feedback").textContent="";document.getElementById("next").textContent="Järgmine mängija →";document.getElementById("next").onclick=()=>{document.getElementById("next").onclick=advance;document.getElementById("next").textContent="Edasi →";render()};return}stage="team";document.getElementById("heading").textContent="Kõik isiklikud lukud avatud!";document.getElementById("question").textContent="Ühendage koodid mängijate järjekorras: "+codes.join(" – ")+". Nüüd lahendage koos kolm viimast ülesannet.";document.getElementById("answers").innerHTML="";document.getElementById("next").textContent="Alusta ühismissiooni →";document.getElementById("next").onclick=()=>{document.getElementById("next").onclick=advance;document.getElementById("next").textContent="Edasi →";render()};return}document.getElementById("status").textContent="🏆 PÕGENEMINE ÕNNESTUS";document.getElementById("heading").textContent="Palju õnne, "+(document.getElementById("team").value||"vaskpillimeistrid")+"!";document.getElementById("question").textContent="Kõik "+n+" mängijat avasid oma lukud ja lahendasid ühismissiooni. Teie kood: "+codes.join("")+".";document.getElementById("answers").innerHTML="";document.getElementById("feedback").textContent="";document.getElementById("next").style.display="none";let b=document.createElement("button");b.textContent="Mängi uuesti";b.onclick=()=>location.reload();document.getElementById("answers").append(b)}
</script></html>
